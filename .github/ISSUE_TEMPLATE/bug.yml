name: Something's broken
description: A world, a city or a view that doesn't work
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Link
      description: The address where it happens (it includes the world or the city)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
