name: Refresh the universe

# Every day: reseed the galaxies from GitHub (new stars, rising projects, stargazers who joined),
# log what migrated between galaxies, regenerate the news, commit, and redeploy the site.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: universe
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reseed the galaxies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/universe/seed.mjs
      - name: Regenerate the news
        run: node tools/universe/events.mjs
      - name: Commit if anything moved
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/universe
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Universe: daily refresh $(date -u +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # a push made with GITHUB_TOKEN doesn't start other workflows, so ask for the deploy directly
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
