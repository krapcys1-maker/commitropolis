<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Commitverse</title>
    <meta name="description" content="The universe of open source: every GitHub account is a world, every repository a city, every star a light in its sky." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>

    <header class="hud-top">
      <a class="brand" href="./"><span class="mark"></span>COMMITVERSE</a>
      <nav id="crumbs"></nav>
      <div class="spacer"></div>
      <input id="search" type="search" placeholder="Fly to a world: @login" autocomplete="off" spellcheck="false" />
      <a id="film-btn" class="hud-btn" href="media/commitverse-bigbang.mp4" target="_blank" rel="noopener" title="The Big Bang of open source: the film (72 s, sound on)">▶ Film</a>
      <button id="codex-btn">Codex</button>
    </header>

    <aside id="card" hidden></aside>
    <div id="tooltip" hidden></div>
    <div id="hint"></div>
    <div id="toast" hidden></div>
    <section id="survey" hidden></section>
    <div id="fade"></div>
    <section id="codex" hidden></section>
    <section id="prologue" hidden>
      <div class="lines"></div>
      <div class="skip">click to skip</div>
    </section>
    <div id="loading">Charting the galaxy…</div>

    <script type="module" src="/src/universe/main.js"></script>
  </body>
</html>
